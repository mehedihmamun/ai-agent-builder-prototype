# Every push to main builds the prototype and updates the public link
# https://ai-agent-builder-prototype.vercel.app (Vercel project ai-agent-builder-prototype).
# It also attaches the single-file HTML export to the run, for teammates to download.
#
# Repo secrets: VERCEL_TOKEN (created by the owner at vercel.com/account/tokens),
# VERCEL_ORG_ID and VERCEL_PROJECT_ID (from .vercel/project.json).
name: Deploy prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@65.11.0

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Uses vercel.json: npm --prefix prototype ci, then npm --prefix prototype run build:share
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Attach the downloadable HTML file
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Builder-Prototype
          path: prototype/dist-share/index.html
          retention-days: 30
